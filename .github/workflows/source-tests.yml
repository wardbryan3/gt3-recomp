name: Public source and documentation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Public build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y just clang cmake ninja-build
      - name: Current authority, historical negatives and publication
        run: just check
      - name: Public source contracts and software runtime
        run: just test
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docusaurus/package-lock.json
      - name: Documentation entry point
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          just setup
          just docs-build
